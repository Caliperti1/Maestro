services:
  - type: web
    name: maestro-api
    runtime: docker
    region: virginia
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: python -m app.operations.api
    preDeployCommand: python -m app.operations.deployment_check && alembic upgrade head
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    numInstances: 1
    envVars:
      - fromGroup: maestro-cloud-config
      - key: DATABASE_URL
        fromDatabase:
          name: maestro-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MAESTRO_PROCESS_ROLE
        value: web
      - key: SCHEDULER_WORKER_AUTORUN
        value: "false"
      - key: GMAIL_TRIGGER_AUTORUN
        value: "false"
      - key: MEMORY_DROPBOX_AUTORUN
        value: "false"

  - type: worker
    name: maestro-worker
    runtime: docker
    region: virginia
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: python -m app.operations.worker
    maxShutdownDelaySeconds: 120
    numInstances: 1
    envVars:
      - fromGroup: maestro-cloud-config
      - key: DATABASE_URL
        fromDatabase:
          name: maestro-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MAESTRO_PROCESS_ROLE
        value: worker
      - key: SCHEDULER_WORKER_AUTORUN
        value: "true"
      - key: GMAIL_TRIGGER_AUTORUN
        value: "false"
      - key: MEMORY_DROPBOX_AUTORUN
        value: "false"

databases:
  - name: maestro-postgres
    region: virginia
    plan: 0.5c-1g
    databaseName: maestro
    user: maestro
    postgresMajorVersion: "16"
    ipAllowList: []

envVarGroups:
  - name: maestro-cloud-config
    envVars:
      - key: APP_NAME
        value: Maestro
      - key: APP_HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openai/gpt-5.6-terra
      - key: LLM_QWEN_MODEL_PROFILE
        value: openrouter:openai/gpt-5.6-luna
      - key: LLM_LUNA_MODEL_PROFILE
        value: openrouter:openai/gpt-5.6-luna
      - key: LLM_TERRA_MODEL_PROFILE
        value: openrouter:openai/gpt-5.6-terra
      - key: LLM_SOL_MODEL_PROFILE
        value: openrouter:openai/gpt-5.6-sol
      - key: OPENROUTER_HTTP_REFERER
        value: https://maestro.invalid
      - key: OPENROUTER_APP_TITLE
        value: Maestro
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: ROUTED_RESOLVER_LLM_PROVIDER
        value: none
      - key: ROUTED_ENRICHER_LLM_PROVIDER
        value: none
      - key: MAESTRO_INTENT_CLASSIFIER_PROVIDER
        value: none
      - key: MAESTRO_TOPIC_RESOLVER_PROVIDER
        value: none
